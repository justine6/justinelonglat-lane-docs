name: CI — Docs Build & Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate committed partials
        run: node scripts/check-partials.mjs

      - name: Validate committed site
        run: node scripts/validate-site.mjs --root public
